<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="container header-content">
      <div class="brand">
        <h1>Tasks</h1>
        <span class="version-pill">Workspace</span>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" class="btn btn-ghost" type="button">Light Mode</button>
        <button id="export-btn" class="btn btn-ghost" type="button">Export JSON</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="storage-alert" class="alert-banner hidden" role="alert">
      <span>Corrupted localStorage data was detected and safely reset.</span>
      <button id="dismiss-alert" type="button" aria-label="Dismiss alert">&times;</button>
    </div>

    <section id="stats-container" class="stats-grid" aria-label="Task Statistics"></section>

    <div class="dashboard-layout">
      <aside class="form-panel">
        <form id="task-form" class="panel" novalidate>
          <h2 id="form-title">New Task</h2>
          <input type="hidden" id="task-id" />

          <div class="form-group">
            <label for="task-title">Title <span class="required">*</span></label>
            <input type="text" id="task-title" placeholder="What needs to be done?" required />
            <small id="title-error" class="error-msg hidden">Title is required.</small>
          </div>

          <div class="form-group">
            <label for="task-desc">Description</label>
            <textarea id="task-desc" rows="3" placeholder="Add details..."></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="task-priority">Priority</label>
              <select id="task-priority">
                <option value="Low">Low</option>
                <option value="Medium" selected>Medium</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="form-group">
              <label for="task-status">Status</label>
              <select id="task-status">
                <option value="To Do" selected>To Do</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="task-due">Due Date</label>
            <input type="date" id="task-due" />
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">Create Task</button>
            <button type="button" id="cancel-edit-btn" class="btn btn-ghost hidden">Cancel</button>
          </div>
        </form>
      </aside>

      <section class="tasks-panel">
        <div class="filter-bar">
          <input type="search" id="search-input" placeholder="Search tasks..." aria-label="Search tasks by title" />
          
          <select id="filter-status" aria-label="Filter by Status">
            <option value="All">Status: All</option>
            <option value="To Do">To Do</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>

          <select id="filter-priority" aria-label="Filter by Priority">
            <option value="All">Priority: All</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>

          <select id="sort-by" aria-label="Sort Tasks">
            <option value="newest">Sort: Newest</option>
            <option value="dueDate">Sort: Due Date</option>
            <option value="priority">Sort: Priority</option>
          </select>

          <button id="clear-filters-btn" class="btn btn-ghost" type="button">Reset</button>
        </div>

        <div id="tasks-container" class="tasks-grid"></div>
      </section>
    </div>
  </main>

  <div id="undo-toast" class="toast hidden" role="status" aria-live="polite">
    <span id="toast-message">Task deleted</span>
    <button id="undo-btn" class="btn-undo" type="button">Undo</button>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
